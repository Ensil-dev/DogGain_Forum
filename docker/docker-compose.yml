version: '3.8'

services:
  doggain-forum:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: doggain-forum
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s